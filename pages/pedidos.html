
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>COMEFELIZ</title>

  <!-- Materialize CSS -->
  <link rel="stylesheet" href="/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">

  <!-- Materialize JS -->
  <script src="/js/materialize.min.js"></script>
</head>

<body class="grey lighten-4">

  <!-- Barra de navegación -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/">COMEFELIZ</a>

      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- Menú lateral -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">COMEFELIZ</a></li>
    <li><a href="/" class="waves-effect">Home</a></li>
    <li><a href="/pages/about.html" class="waves-effect">About</a></li>

    <li><div class="divider"></div></li>

    <li>
      <a href="/pages/contact.html" class="waves-effect">
        <i class="material-icons">mail_outline</i>Contact
      </a>
    </li>
  </ul>

  <!-- Contenido -->
  <div class="container grey-text">

    <div class="card-panel">

      <h5 class="center">Pedido de Platillo</h5>

      <!-- Nombre -->
      <div class="input-field">
        <input type="text" id="nombre">
        <label for="nombre">Nombre de la persona</label>
      </div>

      <!-- Dirección -->
      <div class="input-field">
        <input type="text" id="direccion">
        <label for="direccion">Dirección</label>
      </div>

      <!-- Platillo -->
      <div class="input-field">
        <select id="Platillo">
          <option value="" disabled selected>Seleccione un Platillo</option>
          <option value="Alitas">Alitas</option>
          <option value="Boneless">Boneless</option>
          <option value="Hamburguesa">Hamburguesa</option>
        </select>
        <label>Platillo</label>
      </div>

      <div class="center">

        <button id="btnGuardar" class="btn green waves-effect">
          <i class="material-icons left">save</i>
          Guardar
        </button>

        <button id="btnCancelar" class="btn red waves-effect">
          <i class="material-icons left">cancel</i>
          Cancelar
        </button>

      </div>

    </div>

    <button id=""btnUbicacion>Ubicacion</button>

  </div>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>

  <script src="/js/firebase.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {

      // Inicializar Materialize
      var elems = document.querySelectorAll('select');
      M.FormSelect.init(elems);

      // Controles
      const nombre = document.getElementById("nombre");
      const direccion = document.getElementById("direccion");
      const platillo = document.getElementById("Platillo");
      const guardar = document.getElementById("btnGuardar");
      const cancelar = document.getElementById("btnCancelar");

      // Guardar en Firestore
      guardar.addEventListener("click", function () {

        if (nombre.value.trim() == "") {
          M.toast({html: "Ingrese el nombre"});
          return;
        }

        if (direccion.value.trim() == "") {
          M.toast({html: "Ingrese la dirección"});
          return;
        }

        if (platillo.value == "") {
          M.toast({html: "Seleccione un platillo"});
          return;
        }

        db.collection("Pedidos").add({
          nombre: nombre.value.trim(),
          direccion: direccion.value.trim(),
          platillo: platillo.value,
          fecha: new Date()
        })
        .then(function () {

          M.toast({html: "Pedido guardado correctamente"});

          // Limpiar campos
          nombre.value = "";
          direccion.value = "";
          platillo.selectedIndex = 0;

          M.updateTextFields();
          M.FormSelect.init(document.querySelectorAll('select'));

        })
        .catch(function (error) {

          console.log(error);
          M.toast({html: "Error al guardar"});

        });

      });

      // Cancelar
      cancelar.addEventListener("click", function () {

        nombre.value = "";
        direccion.value = "";
        platillo.selectedIndex = 0;

        M.updateTextFields();
        M.FormSelect.init(document.querySelectorAll('select'));

        M.toast({html: "Operación cancelada"});

      });

    });
  </script>

</body>
</html>
